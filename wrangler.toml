# Cloudflare Worker for this demo copy. Not the FiberShare app.
# Build: worker-build --release crates/worker
# Deploy: npx wrangler deploy
# Set ACCESS_TEAM_DOMAIN, ACCESS_AUD, PUSH_TOKEN, and ARCGIS_API_KEY with
# `npx wrangler secret put`. Do not put them in this file.
name = "fibershare-dev"
main = "crates/worker/build/worker/shim.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

[build]
command = "worker-build --release crates/worker"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

# Make a KV namespace and paste its id. The id is not a secret.
# npx wrangler kv namespace create FIBERSHARE_LIVE
[[kv_namespaces]]
binding = "FIBERSHARE_LIVE"
id = "00000000000000000000000000000000"

[vars]
# Empty on purpose. A copy with no Access application refuses /api/alerts and
# /api/log. Set the real team domain and audience tag as secrets or vars
# for the copy you deploy. Never commit a real hostname.
# Optional: PUBLIC_ORIGIN is the public scheme and host for canonical and
# social tags (for example https://your-worker.workers.dev). Leave it unset
# and the Worker uses the request URL. Do not commit a real hostname.

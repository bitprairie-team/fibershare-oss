name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: fmt, clippy, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p fibershare-core -p fibershare-html -p fibershare --all-targets -- -D warnings
      - run: cargo test --workspace --exclude fibershare-client --exclude fibershare-worker
      - run: cargo build -p fibershare --release
      - run: sudo apt-get install -y binaryen
      - run: sh scripts/build-client-wasm.sh
      - run: cargo build -p fibershare-worker --target wasm32-unknown-unknown --release
      - name: Styles
        run: |
          curl -fsSL -o "$HOME/tailwindcss" https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.17/tailwindcss-linux-x64
          chmod +x "$HOME/tailwindcss"
          "$HOME/tailwindcss" -i assets/style.css -o public/style.css
  e2e:
    name: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p fibershare
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
  worker:
    name: wrangler dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install worker-build --version 0.8.7 --locked
      - run: node scripts/worker-smoke.mjs

[package]
name = "fibershare"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Local FiberShare server: pages, rancher API, and tracker pull."

[[bin]]
name = "fibershare"
path = "src/main.rs"

[dependencies]
fibershare-core = { workspace = true }
fibershare-html = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
ureq = "2.12"

[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/html",
  "crates/server",
  "crates/client",
  "crates/worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["BitPrairie LLC <legal@bitprairie.com>"]
repository = "https://github.com/bitprairie-team/fibershare-oss"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
scrypt = "0.11"
rand = "0.8"
regex = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
jsonwebtoken = "9"
rsa = { version = "0.9", features = ["sha2", "pem"] }
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
url = "2"
getrandom = "0.2"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
futures = "0.3"
fibershare-core = { path = "crates/core" }
fibershare-html = { path = "crates/html" }

# Size-first profile for the browser island only. The server stays on release.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
